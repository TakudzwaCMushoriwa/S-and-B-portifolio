<section class="section testimonials" id="testimonials" appFadeInOnScroll>
  <div class="container">
    <app-section-title
      [title]="'Success Stories'"
      [subtitle]="'Clients can submit their own testimony and it appears here immediately.'"
    />

    <form
      class="testimonial-form"
      #testimonialForm
      (submit)="submitTestimonial(nameInput.value, countryInput.value, programInput.value, quoteInput.value, resultInput.value, testimonialForm); $event.preventDefault()"
    >
      <h3>Share Your Testimony</h3>
      <div class="form-grid">
        <label>
          Full Name
          <input #nameInput type="text" placeholder="Your full name" required />
        </label>
        <label>
          Country
          <input #countryInput type="text" placeholder="Your country" required />
        </label>
        <label>
          Program
          <input #programInput type="text" placeholder="Scholarship or program" required />
        </label>
        <label>
          Outcome
          <input #resultInput type="text" placeholder="e.g. Admitted with scholarship" required />
        </label>
      </div>
      <label>
        Testimony
        <textarea
          #quoteInput
          rows="4"
          maxlength="420"
          placeholder="Share your experience with S&B Scholarship Agency"
          required
        ></textarea>
      </label>
      <button class="btn primary" type="submit">Submit Testimony</button>
    </form>

    @if (testimonials.length > 0) {
      <div class="testimonials-grid">
        @for (item of testimonials; track item.createdAt) {
          <article class="testimonial-card">
            <p class="quote">"{{ item.quote }}"</p>
            <div class="meta">
              <h3>{{ item.name }}</h3>
              <p class="program">{{ item.program }}</p>
              <p class="country">{{ item.country }}</p>
              <span class="result">{{ item.result }}</span>
            </div>
          </article>
        }
      </div>
    } @else {
      <p class="empty">No testimonies yet. Be the first to share your success story.</p>
    }
  </div>
</section>
